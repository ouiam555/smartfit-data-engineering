services:

  # ========================================================
  # KAFKA
  # ========================================================

  kafka:
    image: apache/kafka:latest
    container_name: smartfit-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ========================================================
  # KAFKA INIT
  # ========================================================

  kafka-init:
    image: apache/kafka:latest

    depends_on:
      kafka:
        condition: service_healthy

    command: >
      bash -c "
      /opt/kafka/bin/kafka-topics.sh
      --create
      --if-not-exists
      --topic smartfit_raw
      --bootstrap-server kafka:29092
      --partitions 1
      --replication-factor 1
      "


  # ========================================================
  # MINIO
  # ========================================================

  minio:
    image: minio/minio:latest
    container_name: smartfit-minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123

    command:
      server /data --console-address ":9001"

    volumes:
      - minio_data:/data


  # ========================================================
  # SPARK
  # ========================================================

  spark:
    image: apache/spark:latest
    container_name: smartfit-spark

    ports:
      - "4040:4040"

    volumes:
      - ./spark:/opt/spark/work-dir

    command:
      sleep infinity


  # ========================================================
  # RUNNER
  # ========================================================

  runner:
    build:
      context: ./runner

    container_name: smartfit-runner

    env_file:
      - .env

    environment:
      TZ: Africa/Casablanca
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: silver

    volumes:
      - .:/opt/project
      - ${HOME}/.dbt:/root/.dbt

    depends_on:
      kafka:
        condition: service_healthy

      minio:
        condition: service_started

    command:
      sleep infinity


  # ========================================================
  # AIRFLOW POSTGRES
  # ========================================================

  postgres:
    image: postgres:16
    container_name: smartfit-airflow-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U airflow -d airflow"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # ========================================================
  # AIRFLOW INIT
  # ========================================================

  airflow-init:
    build:
      context: ./airflow

    container_name: smartfit-airflow-init

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres/airflow"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Africa/Casablanca

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Ouiam
      --lastname Admin
      --role Admin
      --email admin@example.com
      || true
      "


  # ========================================================
  # AIRFLOW WEBSERVER
  # ========================================================

  airflow-webserver:
    build:
      context: ./airflow

    container_name: smartfit-airflow-webserver

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres/airflow"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Africa/Casablanca

      AIRFLOW__SMTP__SMTP_HOST: smtp.gmail.com
      AIRFLOW__SMTP__SMTP_STARTTLS: "True"
      AIRFLOW__SMTP__SMTP_SSL: "False"
      AIRFLOW__SMTP__SMTP_USER: ${AIRFLOW_SMTP_USER}
      AIRFLOW__SMTP__SMTP_PASSWORD: ${AIRFLOW_SMTP_PASSWORD}
      AIRFLOW__SMTP__SMTP_PORT: "587"
      AIRFLOW__SMTP__SMTP_MAIL_FROM: ${AIRFLOW_SMTP_USER}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs

    ports:
      - "8080:8080"

    command:
      webserver


  # ========================================================
  # AIRFLOW SCHEDULER
  # ========================================================

  airflow-scheduler:
    build:
      context: ./airflow

    container_name: smartfit-airflow-scheduler

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully

      runner:
        condition: service_started

      spark:
        condition: service_started

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@postgres/airflow"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Africa/Casablanca
      TZ: Africa/Casablanca

      AIRFLOW__SMTP__SMTP_HOST: smtp.gmail.com
      AIRFLOW__SMTP__SMTP_STARTTLS: "True"
      AIRFLOW__SMTP__SMTP_SSL: "False"
      AIRFLOW__SMTP__SMTP_USER: ${AIRFLOW_SMTP_USER}
      AIRFLOW__SMTP__SMTP_PASSWORD: ${AIRFLOW_SMTP_PASSWORD}
      AIRFLOW__SMTP__SMTP_PORT: "587"
      AIRFLOW__SMTP__SMTP_MAIL_FROM: ${AIRFLOW_SMTP_USER}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock

    group_add:
      - "${DOCKER_GID:-999}"

    command:
      scheduler


# ==========================================================
# VOLUMES
# ==========================================================

volumes:
  kafka_data:
  minio_data:
  airflow_postgres_data: